name: Update course catalog

on:
  push:
    branches: [main]
    paths:
      - 'courses/**'
      - 'tools/generate_index.go'
      - '.github/workflows/index.yml'

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build catalog
        run: GO111MODULE=off go run ./tools/generate_index.go
      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update course catalog'
            git push
          fi
